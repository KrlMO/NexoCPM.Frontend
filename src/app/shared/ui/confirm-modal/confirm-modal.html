<div class="fixed inset-0 z-50 flex items-center justify-center">
  <div class="absolute inset-0 bg-black/40 backdrop-blur-sm" (click)="cancel.emit()"></div>
  <div class="relative bg-surface rounded-xl shadow-2xl p-6 max-w-md sm:max-w-lg w-full mx-4" (click)="$event.stopPropagation()">
    <h3 class="text-xl font-bold text-txt-primary mb-2">{{ title }}</h3>
    <p class="text-txt-secondary mb-6">{{ message }}</p>
    <div class="flex flex-col sm:flex-row justify-end gap-2 sm:gap-3 [&>*]:w-full sm:[&>*]:flex-1">
      <app-secondary-button [label]="cancelLabel" variant="primary" (click)="cancel.emit()" />
      @if (secondaryLabel) {
      <app-secondary-button [label]="secondaryLabel" variant="primary" (click)="secondary.emit()" />
      }
      <app-primary-button [label]="confirmLabel" [variant]="confirmVariant" (click)="confirm.emit()" />
    </div>
  </div>
</div>
