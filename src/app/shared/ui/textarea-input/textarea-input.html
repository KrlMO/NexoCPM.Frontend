<div class="flex flex-col gap-1 w-full mt-4">
  @if (label) {
    <label class="text-sm md:text-base text-foreground">
      {{ label }}
    </label>
  }

  <div class="relative">
    <textarea
      [placeholder]="placeholder"
      [formControl]="control"
      [rows]="rows"
      class="
        w-full
        px-4 md:px-6
        py-3
        rounded-xl md:rounded-[20px]
        border border-primary-dark border-input
        bg-background text-foreground
        placeholder:text-muted-foreground
        text-sm md:text-base
        focus-visible:outline-none
        focus:ring-2 focus:ring-danger
        disabled:opacity-50 disabled:cursor-not-allowed disabled:bg-[#F1F5F9]
        transition-all
        resize-y
      "
      [class.border-danger]="control.invalid && control.touched"
    ></textarea>
  </div>

  @if (control.invalid && control.touched) {
    <p class="text-danger text-sm">
      @if (control.hasError('required')) { Este campo es obligatorio. }
    </p>
  }
</div>
