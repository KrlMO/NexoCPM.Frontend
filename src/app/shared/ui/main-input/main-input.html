<div class="flex flex-col gap-1 w-full mt-5">
    @if (label) {
    <label class="text-base text-foreground">{{ label }}</label>
    }
    <div class="relative">
        <input [type]="type" [placeholder]="placeholder" [formControl]="control"
            class="w-full px-4 md:px-6 md:py-3 rounded-[20px] border border-primary-dark border-input bg-background text-foreground placeholder:text-muted-foreground focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-blue-500 disabled:cursor-not-allowed disabled:opacity-50 transition-all" />
    </div>
</div>
