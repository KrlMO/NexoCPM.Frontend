<div class="min-h-screen flex items-center justify-center p-4">
    <app-card class="w-full max-w-md sm:max-w-lg md:max-w-xl">
        <form [formGroup]="forgotForm" (ngSubmit)="onSubmit($event)">
            <div class="flex flex-col items-center">
                <a routerLink="/">
                    <img src="logos/logo.svg" width="78" height="59" alt="Logo NexoCPM">
                </a>
                <h1 class="text-4xl text-txt-primary font-bold mb-4 mt-4">Recuperar contraseña</h1>
                <p class="text-center text-md text-muted-foreground">
                    Ingresa tu correo electrónico y te enviaremos las instrucciones para restablecer tu contraseña
                </p>
            </div>
            <div class="mt-10 flex flex-col lg:gap-2 md:gap-2">
                <app-main-input label="Correo electrónico" placeholder="Ingresa tu correo electrónico" type="email"
                    [control]="emailControl" />
            </div>
            <div class="flex justify-center mt-8">
                <app-primary-button label="Enviar instrucciones" type="submit" />
            </div>
            <div class="mt-10">
                <p class="text-center mt-4 text-sm">
                    <a routerLink="/auth/login" class="text-primary font-semibold">Volver al inicio de sesión</a>
                </p>
            </div>
        </form>
    </app-card>
</div>
