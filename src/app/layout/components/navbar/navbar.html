<nav class="w-full h-16 px-4 md:px-6 flex items-center justify-between bg-surface text-txt-primary shadow-md relative">

    <a routerLink="/" class="flex items-center">
        <img src="logos/logo.svg" width="50" height="40" alt="Logo NexoCPM">
    </a>

    <div class="hidden md:flex items-center gap-6 text-gray-600">
        <a (click)="goHome()" class="hover:text-primary-dark transition cursor-pointer">Inicio</a>
        <a routerLink="/app/syllabi" class="hover:text-primary-dark transition">Temarios</a>
        <a routerLink="/app/evaluations/simulations" class="hover:text-primary-dark transition">Simulacros</a>
        <a routerLink="/app/ranking" class="hover:text-primary-dark transition">Ranking</a>
        <!-- <a routerLink="/app/resources" class="hover:text-primary-dark transition">Materiales</a> -->
    </div>

    <div class="flex items-center gap-2 md:gap-4">

        @if (!(user$ | async)) {
        <app-primary-button class="hidden md:block" label="Iniciar Sesión" (clicked)="goLogin()" />

        <button class="md:hidden p-2" (click)="toggleMobileMenu()">
            ☰
        </button>
        }

        @if (user$ | async; as user) {
        <div class="flex items-center gap-1 bg-amber-50/80 border border-amber-200/50 rounded-full px-3 py-1 text-sm font-semibold text-amber-700">
            <span>{{ user.numberStar ?? 0 }}</span>
            <app-star [filled]="true" sizeClass="w-5 h-5" filledColorClass="text-amber-500" />
        </div>

        <div class="hidden md:block relative">
            <button class="flex items-center gap-2 px-3 py-2 rounded-lg hover:bg-gray-100 transition"
                (click)="toggleUserMenu()">
                {{ user.userName }}
                <span class="text-sm">▼</span>
            </button>

            <div *ngIf="userMenuOpen"
                class="absolute right-0 mt-2 w-48 bg-white border border-primary-dark rounded-xl shadow-lg flex flex-col overflow-hidden">
                <button class="px-4 py-2 text-left hover:bg-gray-50 flex items-center gap-3 text-txt-primary cursor-pointer transition" (click)="goProfile()">
                    <svg class="w-5 h-5 text-primary-dark shrink-0" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <circle cx="12" cy="6" r="4" stroke="currentColor" stroke-width="1.5"/>
                        <path d="M20 17.5C20 19.9853 20 22 12 22C4 22 4 19.9853 4 17.5C4 15.0147 7.58172 13 12 13C16.4183 13 20 15.0147 20 17.5Z" stroke="currentColor" stroke-width="1.5"/>
                    </svg>
                    <span class="text-sm font-medium">Perfil</span>
                </button>
                <button class="px-4 py-2 text-left hover:bg-gray-50 flex items-center gap-3 text-txt-primary cursor-pointer transition" (click)="goPreparation()">
                    <svg class="w-5 h-5 text-primary-dark shrink-0" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path fill-rule="evenodd" clip-rule="evenodd" d="M28 17C27.4477 17 27 16.5523 27 16V8H14C12.8954 8 12 8.89543 12 10V38C12 39.1046 12.8954 40 14 40H34C35.1046 40 36 39.1046 36 38V17H28ZM38 16V38C38 40.2091 36.2091 42 34 42H14C11.7909 42 10 40.2091 10 38V10C10 7.79086 11.7909 6 14 6H28L38 16ZM29 9.82843L34.1716 15H29V9.82843Z" fill="currentColor"/>
                        <path fill-rule="evenodd" clip-rule="evenodd" d="M14 33C14 32.4477 14.4477 32 15 32L33 32C33.5523 32 34 32.4477 34 33C34 33.5523 33.5523 34 33 34L15 34C14.4477 34 14 33.5523 14 33Z" fill="currentColor"/>
                        <path fill-rule="evenodd" clip-rule="evenodd" d="M14 37C14 36.4477 14.4477 36 15 36H27C27.5523 36 28 36.4477 28 37C28 37.5523 27.5523 38 27 38H15C14.4477 38 14 37.5523 14 37Z" fill="currentColor"/>
                        <path fill-rule="evenodd" clip-rule="evenodd" d="M20 16C20.4037 16 20.7678 16.2427 20.9231 16.6154L25.9231 28.6154C26.1355 29.1252 25.8944 29.7107 25.3846 29.9231C24.8748 30.1355 24.2894 29.8944 24.0769 29.3846L20 19.6L15.9231 29.3846C15.7107 29.8944 15.1252 30.1355 14.6154 29.9231C14.1056 29.7107 13.8645 29.1252 14.0769 28.6154L19.0769 16.6154C19.2322 16.2427 19.5963 16 20 16Z" fill="currentColor"/>
                        <path fill-rule="evenodd" clip-rule="evenodd" d="M16 25H24V27H16V25Z" fill="currentColor"/>
                        <path fill-rule="evenodd" clip-rule="evenodd" d="M30 22C30.5523 22 31 22.4477 31 23L31 29C31 29.5523 30.5523 30 30 30C29.4477 30 29 29.5523 29 29L29 23C29 22.4477 29.4477 22 30 22Z" fill="currentColor"/>
                        <path fill-rule="evenodd" clip-rule="evenodd" d="M26 26C26 25.4477 26.4477 25 27 25L33 25C33.5523 25 34 25.4477 34 26C34 26.5523 33.5523 27 33 27L27 27C26.4477 27 26 26.5523 26 26Z" fill="currentColor"/>
                    </svg>
                    <span class="text-sm font-medium">Mi preparación</span>
                </button>
                <button class="px-4 py-2 text-left hover:bg-gray-50 flex items-center gap-3 text-txt-primary cursor-pointer transition border-t border-gray-100" (click)="logout()">
                    <svg class="w-5 h-5 text-primary-dark shrink-0" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M15 12L2 12M2 12L5.5 9M2 12L5.5 15" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M9.00195 7C9.01406 4.82497 9.11051 3.64706 9.87889 2.87868C10.7576 2 12.1718 2 15.0002 2L16.0002 2C18.8286 2 20.2429 2 21.1215 2.87868C22.0002 3.75736 22.0002 5.17157 22.0002 8L22.0002 16C22.0002 18.8284 22.0002 20.2426 21.1215 21.1213C20.3531 21.8897 19.1752 21.9983 17 21.9983M9.00195 17C9.01406 19.175 9.11051 20.3529 9.87889 21.1213C10.5202 21.7626 11.4467 21.9359 13 21.9827" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                    </svg>
                    <span class="text-sm font-medium">Cerrar sesión</span>
                </button>
            </div>
        </div>

        <button class="md:hidden p-2" (click)="toggleMobileMenu()">
            ☰
        </button>

        }

    </div>
</nav>

<div *ngIf="mobileMenuOpen" class="md:hidden bg-surface border-t border-border shadow-lg px-4 py-4 flex flex-col gap-2">

    <!-- LINKS -->
    <a (click)="goHome(); closeMobileMenu()" class="cursor-pointer px-3 py-2 text-txt-primary hover:bg-gray-50 rounded-lg transition text-sm font-medium">Inicio</a>
    <a routerLink="/app/syllabi" (click)="closeMobileMenu()" class="px-3 py-2 text-txt-primary hover:bg-gray-50 rounded-lg transition text-sm font-medium">Temarios</a>
    <a routerLink="/app/evaluations/simulations" (click)="closeMobileMenu()" class="px-3 py-2 text-txt-primary hover:bg-gray-50 rounded-lg transition text-sm font-medium">Simulacros</a>
    <a routerLink="/app/ranking" (click)="closeMobileMenu()" class="px-3 py-2 text-txt-primary hover:bg-gray-50 rounded-lg transition text-sm font-medium">Ranking</a>

</div>
